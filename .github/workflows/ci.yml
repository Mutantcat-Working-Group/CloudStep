name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/cloud-step-web-1g/yarn.lock

      - name: Build web UI
        working-directory: web/cloud-step-web-1g
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build without CGO
        run: CGO_ENABLED=0 go build ./...
